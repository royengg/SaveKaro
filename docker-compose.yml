services:
  # Redis for Job Queues
  redis:
    image: redis:7-alpine
    container_name: savekaro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savekaro-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      USE_QUEUE: "true"
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.savekaro.online/api/auth/google/callback}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-SaveKaro/1.0}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-deals@savekaro.online}
      FRONTEND_URL: ${FRONTEND_URL:-https://savekaro.online}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TITLE_MODEL: ${GEMINI_TITLE_MODEL:-gemini-3.1-flash-lite}
      POSTHOG_ENABLED: ${POSTHOG_ENABLED:-false}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      APP_ENV: ${APP_ENV:-production}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.savekaro.online}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_POSTHOG_ENABLED: ${POSTHOG_ENABLED:-false}
        VITE_POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
        VITE_POSTHOG_UI_HOST: ${VITE_POSTHOG_UI_HOST:-https://us.posthog.com}
        VITE_POSTHOG_REQUIRE_CONSENT: ${VITE_POSTHOG_REQUIRE_CONSENT:-true}
        VITE_POSTHOG_SESSION_REPLAY_ENABLED: ${VITE_POSTHOG_SESSION_REPLAY_ENABLED:-false}
        VITE_APP_ENV: ${APP_ENV:-production}
        VITE_APP_VERSION: ${APP_VERSION:-unknown}
        VITE_UMAMI_ENABLED: ${VITE_UMAMI_ENABLED:-true}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-https://umami.cooldash.xyz/script.js}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-d74b89a0-1e26-40bd-b27a-25b04103a8e3}
    container_name: savekaro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  redis_data:
